name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release must pass the contract suite against the pinned gateway.
      - name: Check out AI Gateway (pinned)
        uses: actions/checkout@v4
        with:
          repository: ferro-labs/ai-gateway
          ref: v1.4.5
          path: .gateway
      - uses: actions/setup-go@v5
        with:
          go-version-file: .gateway/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./scripts/with-gateway.sh
        env:
          FERRO_GATEWAY_SOURCE: ${{ github.workspace }}/.gateway
      - run: rm -rf .gateway
      - run: npm run build

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -e "import('fs').then(f=>process.stdout.write(JSON.parse(f.readFileSync('package.json','utf8')).version))")"
          if [ "$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
